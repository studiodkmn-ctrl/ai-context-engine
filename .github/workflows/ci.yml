# CI — AI Context Engine (v8 Baustein C)
#
# Drei Prüfschichten:
#   1. shellcheck über ALLE Shell-Skripte (Severity: warning; Ausnahmen nur
#      als begründete `# shellcheck disable=…`-Kommentare direkt im Skript)
#   2. MCP-Schicht: npm ci + Build + Smoke-Test (mcp/test/smoke.mjs)
#   3. End-to-End: ai-verify-self.sh — Dummy-Next.js-Projekt, Setup,
#      drawers.yaml, Interaction Map, Doctor 0 FAIL, locate() findet Button
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (alle *.sh)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          find . -name "*.sh" -not -path "./mcp/node_modules/*" -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck --severity=warning

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Smoke-Test (MCP-Tools)
        run: node test/smoke.mjs
      - name: Dist für verify-self hochladen
        uses: actions/upload-artifact@v4
        with:
          name: mcp-dist
          path: mcp/dist

  verify-self:
    runs-on: ubuntu-latest
    needs: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: mcp-dist
          path: mcp/dist
      - name: End-to-End-Selbsttest (Dummy-Projekt → Setup → Doctor → locate)
        run: bash _ai_context_template/scripts/ai-verify-self.sh
